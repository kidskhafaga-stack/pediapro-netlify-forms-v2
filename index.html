<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PediaPro - Specialty Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f4f7f9] text-[#2d3748] font-cairo antialiased">
    <div id="root"></div>
    <!-- Netlify Forms blueprint: detected at build time only, never shown to users.
         Every field name here MUST match a field the React app actually posts in
         src/utils/flattenSubmission.ts + src/App.tsx, otherwise Netlify drops it
         from the submission silently. This is what makes the CSV/Excel export in
         the Netlify dashboard show one clean column per question instead of a
         single unreadable JSON blob. -->
    <form
      name="pediapro-survey"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="pediapro-survey" />
      <input type="hidden" name="submission_id" />
      <input type="hidden" name="submitted_at" />
      <input type="hidden" name="doctor_name" />
      <input type="hidden" name="degree" />
      <input type="hidden" name="visit_date" />
      <input type="hidden" name="email" />
      <input type="hidden" name="phone" />
